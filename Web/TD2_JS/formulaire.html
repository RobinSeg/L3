<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Formulaire JS</title>
</head>

<body>

<h2>Lien et images</h2>
<div id="lien">
<a id="wiki" href="https://en.wikipedia.org">Wikipedia</a>
</div>

<hr>

<h2>Des éléments !</h2>
<label>Texte : <input id="reponse" type="text"></label>

<p>
<label><input type="radio" name="choix" value="1"> Choix N°1</label>
<label><input type="radio" name="choix" value="2"> Choix N°2</label>
<label><input type="radio" name="choix" value="3"> Choix N°3</label>
</p>

<input id="reponse" type="password">

<p id="volumeLabel">Volume</p>
<input type="range" id="volume" value="5" max="11">
<br>
<span id="valeur"></span>

<p>
<label for="coche">Une case à cocher</label>
<input type="checkbox" id="coche">
</p>

<label for="date">date :</label>
<input type="date" id="date" name="date" min="2000-01-01" max="2050-01-01">

<div><button id="ok">Ok</button></div>

<hr>
<h2>Barres de Progression</h2>

<p>
    Téléchargement en cours :
    <progress id="prog1" value="0" max="100"></progress>
</p>

<p>
    Espace disponible :
    <progress id="prog2" value="0" max="100"></progress>
</p>

<hr>

<script src="script/formulaire.js"></script>
</body>
</html>
