<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperHeroes App</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>
<div id="app">
    <h1 style="font-family: Impact, 'Arial Narrow Bold', sans-serif;" class="my-4 text-center">Liste des super-héros</h1>
    
    <div class="text-center">
        <p><input type="checkbox" id="showpower">Afficher les pouvoirs</p>
    </div>
    <ul class="list-group m-5">
        <li v-for="hero in superheros" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <p class="h5">{{ hero.name }}</p>
            <img :src=hero.images.md class="rounded-circle align-items-center" width="100%" style="min-width: 4rem; max-width: 6rem;">
            <p class="small">{{ hero.id }}</p>
        </li>
    </ul>

</div>

<!-- Scripts -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script> <!-- Vue js --> 
<script src="https://unpkg.com/axios@latest"></script>                  <!-- Axios -->

<script src="scripts/Vue.js"></script>
</body>

</html>
